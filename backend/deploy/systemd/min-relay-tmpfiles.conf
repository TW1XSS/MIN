# Каталог логов реле: создаётся на раннем этапе загрузки (systemd-tmpfiles-setup),
# ДО старта min-relay.service — append: не умеет создавать родительские каталоги.
# В final-режиме /var/log снова tmpfs: строка ниже пересоздаёт каталог после
# каждого ребута в tmpfs (логи в RAM — см. «Политика метаданных логов»).
# Persistent auth-state создаёт DynamicUser через StateDirectory=min-relay
# (owner = minrelay, mode 0700); queued ciphertext туда не пишется.
d /var/log/min-relay 0755 root root -
