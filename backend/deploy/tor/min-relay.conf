# MIN relay — Tor hidden service v3.
# Вставляется в /etc/tor/torrc между маркерами «##### MIN-BEGIN/END #####»
# Блок устанавливается bootstrap_node.sh идемпотентно.
#
# Никаких публичных портов: реле доступно только как .onion, роутер не трогаем.

HiddenServiceDir /var/lib/tor/min_relay/
HiddenServicePort 3001 127.0.0.1:3001
HiddenServiceVersion 3

# PoW-защита intro-точек ВЫКЛЮЧЕНА осознанно: у клиентов MIN собственная
# реализация Tor (crate min-tor), PoW-хендшейк они не умеют — с включённой
# защитой клиенты просто не подключатся.
HiddenServicePoWDefensesEnabled 0

# DoS-защита intro-точек клиентов не ломает — включаем.
HiddenServiceEnableIntroDoSDefense 1

# Никаких SOCKS/Control портов: Pi не проксирует чужой трафик через Tor.
# Смешивать реле и посторонний трафик = убить его анонимность (docs §7).
SocksPort 0
ControlPort 0

# Логи Tor — на диск: в DietPi-RAMlog /var/log в tmpfs и чистится ребутом,
# а на бете логи обязательны. Каталог создаёт bootstrap.
Log notice file /var/lib/tor/min_relay/log/notices.log
