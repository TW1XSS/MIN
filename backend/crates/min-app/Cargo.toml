[package]
name = "min-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ciborium.workspace = true
min-protocol = { path = "../min-protocol" }
min-identity = { path = "../min-identity" }
min-session = { path = "../min-session" }
min-delivery = { path = "../min-delivery" }
min-storage = { path = "../min-storage" }
min-request = { path = "../min-request" }
min-crypto = { path = "../min-crypto" }
hex = "0.4"
blake3.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = { workspace = true }
getrandom = { version = "0.2", features = ["std"] }

[dev-dependencies]
min-relay = { path = "../min-relay" }
min-net = { path = "../min-net" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
